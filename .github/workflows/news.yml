name: news
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - fetch_news.py
      - .github/workflows/news.yml
  workflow_dispatch:
concurrency:
  group: news
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_news.py
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json status.json
          git diff --cached --quiet || (git commit -m "update news" && git pull --rebase && git push)
